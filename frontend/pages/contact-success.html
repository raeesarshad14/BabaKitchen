<!doctype html>
<html lang="en">
  <head>
    <meta http-equiv="Content-Language" content="en" />
    <title>Message Sent • BabasKitchen</title>

    <link rel="stylesheet" href="../styles/header.css" />
    <link rel="stylesheet" href="../styles/contact.css" />

    <style>
      body {
        background: #fafafa;
        margin: 0;
        font-family: "Inter", sans-serif;
      }

      .success-wrapper {
        max-width: 700px;
        margin: 80px auto;
        background: #ffffff;
        padding: 40px 50px;
        border-radius: 16px;
        text-align: center;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
        border: 1px solid #e5e5e5;
      }

      .success-icon {
        width: 80px;
        height: 80px;
        margin-bottom: 20px;
      }

      .success-title {
        font-size: 28px;
        margin-bottom: 10px;
        font-weight: 700;
      }

      .success-message {
        font-size: 16px;
        color: #555;
        margin-bottom: 30px;
      }

      .success-btn {
        display: inline-block;
        padding: 12px 22px;
        background: #2ecc71;
        color: #fff;
        border-radius: 8px;
        font-size: 15px;
        font-weight: 600;
        text-decoration: none;
        transition:
          background 0.2s ease,
          transform 0.1s ease;
      }

      .success-btn:hover {
        background: #29b765;
        transform: translateY(-1px);
      }
    </style>
  </head>

  <body>
    <!-- HEADER -->
    <div id="header"></div>

    <div class="success-wrapper">
      <h1 class="success-title">Message Sent Successfully</h1>

      <p class="success-message">
        Thank you for reaching out to BabasKitchen. We’ve received your message
        and will get back to you shortly.
      </p>

      <a href="../pages/index.html" class="success-btn">Back to Home</a>
    </div>

    <!-- COMPONENTS -->
    <script src="../components/header.js"></script>
    <script>
      document.getElementById("header").innerHTML = new Header().render();
    </script>
  </body>
</html>
