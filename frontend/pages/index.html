<!doctype html>
<html>
  <head>
    <title>Restaurant App</title>

    <link rel="stylesheet" href="../styles/header.css" />
    <link rel="stylesheet" href="../styles/animations.css" />
    <link rel="stylesheet" href="../styles/slider.css" />
    <link rel="stylesheet" href="../styles/layout.css" />
    <link rel="stylesheet" href="../styles/sidebar.css" />
    <link rel="stylesheet" href="../styles/menu.css" />
  </head>

  <body>
    <!-- HEADER -->
    <div id="header"></div>

    <!-- WELCOME TEXT -->
    <h1 class="typewriter">Welcome to BabasKitchen</h1>

    <!-- SLIDER -->
    <div id="slider"></div>

    <!-- PAGE CONTAINER -->
    <div class="page-container">
      <div class="menu-section">
        <!-- SIDEBAR -->
        <div id="sidebar"></div>

        <!-- MENU ITEMS (FIXED) -->
        <div id="menu" class="menu-items"></div>
      </div>
    </div>

    <!-- COMPONENTS -->
    <script src="../components/header.js"></script>
    <script src="../components/slider.js"></script>
    <script src="../components/sidebar.js"></script>
    <script src="../components/menuCard.js"></script>
    <script src="../components/menuList.js"></script>

    <script>
      // HEADER
      document.getElementById("header").innerHTML = new Header().render();

      // SLIDER
      const slider = new Slider([
        "../assets/Biryani.png",
        "../assets/ChickenCurry.png",
        "../assets/HalwaPuri.png",
      ]);
      document.getElementById("slider").innerHTML = slider.render();
      slider.init();

      // SIDEBAR
      const sidebar = new Sidebar(["Sliders", "Pasta", "Dessert"]);
      document.getElementById("sidebar").innerHTML = sidebar.render();

      // MENU ITEMS
      const menuItems = [
        new MenuCard("../assets/HalwaPuri.png", "Halwa Puri", 13.75),
        new MenuCard("../assets/Biryani.png", "Chicken Biryani", 12.99),
        new MenuCard("../assets/ChickenCurry.png", "Chicken Curry", 11.5),
      ];

      const menuList = new MenuList(menuItems);
      document.getElementById("menu").innerHTML = menuList.render();
    </script>
  </body>
</html>
