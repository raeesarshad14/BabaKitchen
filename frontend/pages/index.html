<!doctype html>
<html>
  <head>
    <title>Restaurant App</title>

    <link rel="stylesheet" href="../styles/header.css" />
    <link rel="stylesheet" href="../styles/main.css" />
  </head>

  <body>
    <div id="header"></div>

    <h1 class="typewriter">Welcome to BabasKitchen</h1>

    <div class="slider-wrapper">
      <button class="slide-btn left-btn">&#10094;</button>

      <div class="slider">
        <img src="../assets/Biryani.png" class="slide-img" alt="Slide 1" />
        <img src="../assets/ChickenCurry.png" class="slide-img" alt="Slide 2" />
        <img src="../assets/HalwaPuri.png" class="slide-img" alt="Slide 3" />
      </div>

      <button class="slide-btn right-btn">&#10095;</button>
    </div>

    <script src="../components/header.js"></script>
    <script>
      document.getElementById("header").innerHTML = new Header().render();
    </script>

    <script>
      const slider = document.querySelector(".slider");
      const slides = document.querySelectorAll(".slide-img");
      const leftBtn = document.querySelector(".left-btn");
      const rightBtn = document.querySelector(".right-btn");

      let index = 0;

      function updateSlider() {
        slider.style.transform = `translateX(-${index * 100}%)`;

        leftBtn.style.display = index === 0 ? "none" : "block";
        rightBtn.style.display = index === slides.length - 1 ? "none" : "block";
      }

      rightBtn.onclick = () => {
        if (index < slides.length - 1) {
          index++;
          updateSlider();
        }
      };

      leftBtn.onclick = () => {
        if (index > 0) {
          index--;
          updateSlider();
        }
      };

      updateSlider();
    </script>
  </body>
</html>
