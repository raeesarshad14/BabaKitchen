<!doctype html>
<html lang="en">
  <head>
    <meta http-equiv="Content-Language" content="en" />

    <title>Restaurant App</title>

    <link rel="stylesheet" href="../styles/header.css" />
    <link rel="stylesheet" href="../styles/animations.css" />
    <link rel="stylesheet" href="../styles/slider.css" />
    <link rel="stylesheet" href="../styles/layout.css" />
    <link rel="stylesheet" href="../styles/sidebar.css" />
    <link rel="stylesheet" href="../styles/menu.css" />
  </head>

  <body>
    <!-- HEADER -->
    <div id="header"></div>

    <!-- WELCOME TEXT -->
    <h1 class="typewriter">Welcome to BabasKitchen</h1>

    <!-- SLIDER -->
    <!-- SLIDER -->
    <div id="sliderWrapper">
      <div id="slider"></div>
    </div>

    <!-- PAGE CONTAINER -->
    <div id="menuSection" class="page-container">
      <div class="menu-section">
        <!-- SIDEBAR -->
        <div id="sidebar"></div>

        <!-- MENU ITEMS -->
        <div id="menu" class="menu-items"></div>
      </div>
    </div>

    <!-- COMPONENTS -->
    <script src="../components/header.js"></script>
    <script src="../components/slider.js"></script>
    <script src="../components/sidebar.js"></script>
    <script src="../components/menuCard.js"></script>
    <script src="../components/menuList.js"></script>
    <script src="../components/search.js"></script>
    <script src="../components/cart.js"></script>

    <script>
      // HEADER
      document.getElementById("header").innerHTML = new Header().render();

      // SLIDER
      const slider = new Slider([
        "../assets/Biryani.png",
        "../assets/ChickenCurry.png",
        "../assets/HalwaPuri.png",
      ]);
      document.getElementById("slider").innerHTML = slider.render();
      slider.init();

      // SIDEBAR
      const sidebar = new Sidebar(["Sliders", "Pasta", "Dessert"]);
      document.getElementById("sidebar").innerHTML = sidebar.render();

      // MENU ITEMS
      // MENU ITEMS FROM JSON + SEARCH
      async function loadMenu() {
        const response = await fetch("../data/menu.json");
        const menuData = await response.json();

        const menuEl = document.getElementById("menu");

        function renderItems(list) {
          if (!list || list.length === 0) {
            menuEl.innerHTML = "<p>No items found.</p>";
            return;
          }

          menuEl.innerHTML = list
            .map((item) =>
              new MenuCard(item.image, item.name, item.price).render(),
            )
            .join("");
        }

        // initial full render
        renderItems(menuData);

        // hook up search
        new Search(menuData, renderItems);
      }

      loadMenu();

      // GLOBAL CART INSTANCE
      const cart = new Cart();

      // ADD TO CART FUNCTION
      function addToCart(name, price, image) {
        cart.addItem({ name, price, image });
        updateCartCount();
      }

      // UPDATE CART COUNT
      function updateCartCount() {
        const count = cart.getCount();
        const cartCountEl = document.getElementById("cart-count");

        if (count === 0) {
          cartCountEl.textContent = "";
        } else {
          cartCountEl.textContent = count;
        }
      }

      // INITIAL CART COUNT
      updateCartCount();
    </script>
  </body>
</html>
