<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Language" content="en" />
    <title>Menu</title>

    <!-- GLOBAL STYLES -->
    <link rel="stylesheet" href="../styles/main.css" />

    <!-- MENU STYLES -->
    <link rel="stylesheet" href="../menu/menu.css" />
    <link rel="stylesheet" href="../menu/sidebar.css" />

    <!-- HEADER STYLE -->
    <link rel="stylesheet" href="../header/header.css" />

    <!-- SEARCH STYLE -->
    <link rel="stylesheet" href="../search/search.css" />
  </head>

  <body>
    <!-- HEADER -->
    <div id="header"></div>

    <!-- MENU PAGE LAYOUT -->
    <div class="menu-page">
      <!-- SIDEBAR -->
      <div id="menu-sidebar"></div>

      <!-- MENU CONTENT -->
      <div id="menu"></div>
    </div>

    <!-- ⭐ MODAL POPUP FOR ADD BUTTON ⭐ -->
    <div id="menu-modal" class="menu-modal hidden">
      <div class="menu-modal-content">
        <h2 id="modal-item-name"></h2>

        <div class="modal-qty-row">
          <button id="qty-minus" class="qty-btn">−</button>
          <span id="qty-value">12</span>
          <button id="qty-plus" class="qty-btn">+</button>
        </div>

        <div class="modal-price-row">
          <span>Total:</span>
          <span id="modal-total-price">$0</span>
        </div>

        <button id="modal-add-btn" class="modal-add-btn">Add to Cart</button>
        <button id="modal-close" class="modal-close-btn">Close</button>
      </div>
    </div>

    <!-- HEADER -->
    <script src="../header/header.js"></script>

    <!-- SEARCH -->
    <script src="../search/search.js"></script>

    <!-- MENU CORE -->
    <script src="../menu/menuCard.js"></script>
    <script src="../menu/menuList.js"></script>
    <script src="../menu/sidebar.js"></script>
    <script src="../menu/categories.js"></script>

    <!-- CART -->
    <script src="../cart/cart.js"></script>
    <script src="../cart/cartDrawer.js"></script>

    <!-- ⭐ MODAL + ADD TO CART LOGIC ⭐ -->
    <script>
      let selectedItemName = "";
      let selectedItemPrice = 0;
      let selectedQty = 12;

      /* OPEN MODAL WHEN CLICKING ADD BUTTON */
      document.addEventListener("click", function (e) {
        if (e.target.classList.contains("open-modal-btn")) {
          const name = e.target.dataset.name;
          const price = Number(e.target.dataset.price);
          openMenuModal(name, price);
        }
      });

      function openMenuModal(name, price) {
        const modal = document.getElementById("menu-modal");
        const qtyValue = document.getElementById("qty-value");
        const totalPrice = document.getElementById("modal-total-price");

        selectedItemName = name;
        selectedItemPrice = price;
        selectedQty = 12;

        qtyValue.textContent = selectedQty;
        totalPrice.textContent = "$" + selectedQty * selectedItemPrice;

        modal.classList.remove("hidden");

        /* PLUS BUTTON */
        document.getElementById("qty-plus").onclick = () => {
          selectedQty++;
          qtyValue.textContent = selectedQty;
          totalPrice.textContent = "$" + selectedQty * selectedItemPrice;
        };

        /* MINUS BUTTON */
        document.getElementById("qty-minus").onclick = () => {
          if (selectedQty > 12) {
            selectedQty--;
            qtyValue.textContent = selectedQty;
            totalPrice.textContent = "$" + selectedQty * selectedItemPrice;
          }
        };

        /* CLOSE BUTTON */
        document.getElementById("modal-close").onclick = () => {
          modal.classList.add("hidden");
        };

        /* ADD TO CART BUTTON */
        document.getElementById("modal-add-btn").onclick = () => {
          addItemToCart();
          modal.classList.add("hidden");
        };
      }

      /* ADD ITEM TO CART */
      function addItemToCart() {
        const cart = new Cart();

        cart.addItem({
          name: selectedItemName,
          price: selectedItemPrice,
          qty: selectedQty,
          options: {},
        });

        cart.updateCartCount();
      }
    </script>

    <!-- PAGE INIT -->
    <script>
      /* ---------------- HEADER ---------------- */
      initHeader();

      /* ---------------- SIDEBAR ---------------- */
      const sidebar = new Sidebar(categories);
      document.getElementById("menu-sidebar").innerHTML = sidebar.render();
      sidebar.init();

      /* ---------------- MENU SECTIONS ---------------- */
      const menuList = new MenuList();
      menuList.render();

      /* ---------------- CART COUNT ---------------- */
      const cart = new Cart();
      cart.updateCartCount();
    </script>
  </body>
</html>
