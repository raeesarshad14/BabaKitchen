<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Catering • BabasKitchen</title>

    <!-- GLOBAL STYLES -->
    <link rel="stylesheet" href="../styles/main.css" />

    <!-- HEADER STYLE -->
    <link rel="stylesheet" href="../header/header.css" />

    <!-- CATERING PAGE STYLE -->
    <link rel="stylesheet" href="../catering/catering.css" />
  </head>

  <body>
    <!-- HEADER -->
    <div id="header"></div>

    <!-- ⭐ PAGE CONTAINER (correct placement) -->
    <div class="page-container">
      <main class="catering-page">
        <!-- LEFT SIDEBAR -->
        <div id="catering-sidebar"></div>

        <!-- RIGHT CONTENT -->
        <div id="catering-content"></div>
      </main>
    </div>
    <!-- END PAGE CONTAINER -->

    <!-- MODAL -->
    <div class="catering-modal-overlay">
      <div class="catering-modal">
        <h2 id="modal-item-name"></h2>

        <div class="tray-row">
          <span>Small Tray ($<span id="small-price"></span>)</span>
          <div class="qty-controls">
            <button class="qty-btn" onclick="changeQty('small', -1)">-</button>
            <span id="small-qty">0</span>
            <button class="qty-btn" onclick="changeQty('small', 1)">+</button>
          </div>
        </div>

        <div class="tray-row">
          <span>Large Tray ($<span id="large-price"></span>)</span>
          <div class="qty-controls">
            <button class="qty-btn" onclick="changeQty('large', -1)">-</button>
            <span id="large-qty">0</span>
            <button class="qty-btn" onclick="changeQty('large', 1)">+</button>
          </div>
        </div>

        <button class="add-btn" onclick="addCateringToCart()">
          Add to Cart
        </button>
        <br /><br />
        <button onclick="closeCateringModal()">Close</button>
      </div>
    </div>

    <!-- SCRIPTS -->
    <script src="../header/header.js"></script>
    <script src="../cart/cart.js"></script>

    <script src="../catering/cateringSidebar.js"></script>
    <script src="../catering/cateringCard.js"></script>
    <script src="../catering/cateringModal.js"></script>
    <script src="../catering/catering.js"></script>

    <script>
      document.getElementById("header").innerHTML = new Header().render();
    </script>
  </body>
</html>
