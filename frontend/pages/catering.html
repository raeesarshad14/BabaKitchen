<!doctype html>
<html lang="en">
  <head>
    <meta http-equiv="Content-Language" content="en" />
    <meta charset="UTF-8" />
    <title>Catering • BabasKitchen</title>

    <!-- GLOBAL STYLES -->
    <link rel="stylesheet" href="../styles/main.css" />

    <!-- HEADER STYLE -->
    <link rel="stylesheet" href="../header/header.css" />

    <!-- CATERING PAGE STYLE -->
    <link rel="stylesheet" href="../catering/catering.css" />
  </head>

  <body>
    <!-- HEADER -->
    <div id="header"></div>

    <main class="catering-page">
      <div class="catering-title-bar">
        <h1>Catering Packages</h1>
      </div>

      <div id="catering-container" class="catering-container"></div>
    </main>

    <!-- HEADER SCRIPT -->
    <script src="../header/header.js"></script>

    <!-- CATERING CARD COMPONENT -->
    <script src="../catering/cateringCard.js"></script>

    <script>
      // Render header
      document.getElementById("header").innerHTML = new Header().render();

      // Load catering packages
      async function loadCatering() {
        const response = await fetch("../data/catering.json");
        const data = await response.json();

        const container = document.getElementById("catering-container");

        container.innerHTML = data
          .map((pkg) =>
            new CateringCard(pkg.name, pkg.price, pkg.items).render(),
          )
          .join("");
      }

      loadCatering();
    </script>
  </body>
</html>
