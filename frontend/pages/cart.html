<!doctype html>
<html lang="en">
  <head>
    <meta http-equiv="Content-Language" content="en" />
    <meta charset="UTF-8" />
    <title>Your Order • BabasKitchen</title>

    <!-- GLOBAL STYLES -->
    <link rel="stylesheet" href="../styles/main.css" />

    <!-- HEADER STYLE -->
    <link rel="stylesheet" href="../header/header.css" />

    <!-- CART PAGE STYLE -->
    <link rel="stylesheet" href="../cart/cart.css" />
  </head>

  <body>
    <!-- HEADER -->
    <div id="header"></div>

    <h1 class="cart-title">Your Order</h1>

    <!-- CART PAGE CONTENT -->
    <div id="cart-container"></div>

    <!-- HEADER SCRIPT -->
    <script src="../header/header.js"></script>

    <!-- CART SCRIPTS -->
    <script src="../cart/cart.js"></script>
    <script src="../cart/cartDrawer.js"></script>
    <script src="../cart/cartPage.js"></script>

    <script>
      // Render header
      initHeader();

      // Use the global cart instance created in cart.js
      const cartPage = new CartPage();
      document.getElementById("cart-container").innerHTML = cartPage.render();

      // Update quantity (+ / -)
      function updateQty(name, qty) {
        cart.updateQty(name, qty);

        document.getElementById("cart-container").innerHTML =
          new CartPage().render();

        cart.updateCartCount();
      }

      // Remove item from cart
      function removeFromCart(name) {
        cart.removeItem(name);

        document.getElementById("cart-container").innerHTML =
          new CartPage().render();

        cart.updateCartCount();
      }
    </script>
  </body>
</html>
