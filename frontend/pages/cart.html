<!doctype html>
<html lang="en">
  <head>
    <meta http-equiv="Content-Language" content="en" />

    <title>Your Order</title>

    <link rel="stylesheet" href="../styles/header.css" />
    <link rel="stylesheet" href="../styles/cart.css" />
  </head>

  <body>
    <!-- HEADER -->
    <div id="header"></div>

    <h1 class="cart-title">Your Order</h1>

    <!-- CART PAGE CONTENT -->
    <div id="cart-container"></div>

    <!-- COMPONENTS -->
    <script src="../components/header.js"></script>
    <script src="../components/cart.js"></script>
    <script src="../components/cartPage.js"></script>

    <script>
      // Render header
      document.getElementById("header").innerHTML = new Header().render();

      // Render cart page
      const cartPage = new CartPage();
      document.getElementById("cart-container").innerHTML = cartPage.render();

      // Update header cart count
      updateCartCount();

      // Update quantity (+ / -)
      function updateQty(name, qty) {
        const cart = new Cart();
        cart.updateQty(name, qty);

        // Re-render cart page
        const updatedPage = new CartPage();
        document.getElementById("cart-container").innerHTML =
          updatedPage.render();

        // Update header count
        updateCartCount();
      }

      // Remove item from cart
      function removeFromCart(name) {
        const cart = new Cart();
        cart.removeItem(name);

        // Re-render cart page
        const updatedPage = new CartPage();
        document.getElementById("cart-container").innerHTML =
          updatedPage.render();

        // Update header count
        updateCartCount();
      }
    </script>
  </body>
</html>
