<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Desserts • BabasKitchen</title>

    <!-- GLOBAL -->
    <link rel="stylesheet" href="../styles/main.css" />
    <link rel="stylesheet" href="../header/header.css" />

    <!-- DESSERT STYLES -->
    <link rel="stylesheet" href="desserts.css" />
    <link rel="stylesheet" href="desserts.slider.css" />
    <link rel="stylesheet" href="desserts.modal.css" />
  </head>

  <body>
    <div id="header"></div>

    <div id="dessertModal" class="dessert-modal">
      <div class="dessert-modal-content">
        <h2 id="dessertModalName"></h2>

        <!-- SMALL TRAY -->
        <div class="tray-row">
          <!-- TOP ROW: title + price + total -->
          <div class="tray-top">
            <span class="tray-title">Small Tray</span>
            <span class="tray-price" id="dessertSmallPriceUnit"></span>
            <span class="tray-total-inline"
              >Total: <span id="dessertSmallTotal">$0</span></span
            >
          </div>

          <!-- QTY ROW -->
          <div class="tray-controls">
            <button class="qty-btn" onclick="changeDessertQty('small', -1)">
              −
            </button>
            <span id="dessertSmallQty">0</span>
            <button class="qty-btn" onclick="changeDessertQty('small', 1)">
              +
            </button>
          </div>
        </div>

        <!-- LARGE TRAY -->
        <div class="tray-row">
          <!-- TOP ROW: title + price + total -->
          <div class="tray-top">
            <span class="tray-title">Large Tray</span>
            <span class="tray-price" id="dessertLargePriceUnit"></span>
            <span class="tray-total-inline"
              >Total: <span id="dessertLargeTotal">$0</span></span
            >
          </div>

          <!-- QTY ROW -->
          <div class="tray-controls">
            <button class="qty-btn" onclick="changeDessertQty('large', -1)">
              −
            </button>
            <span id="dessertLargeQty">0</span>
            <button class="qty-btn" onclick="changeDessertQty('large', 1)">
              +
            </button>
          </div>
        </div>

        <!-- SUBTOTAL -->
        <div class="dessert-subtotal">
          Subtotal: <span id="dessertSubtotal">$0</span>
        </div>

        <button class="add-btn" onclick="addDessertToCart()">
          Add to Cart
        </button>
        <button class="close-btn" onclick="closeDessertModal()">Close</button>
      </div>
    </div>

    <!-- ⭐ DESSERT SLIDER -->
    <div class="dessert-slider-wrapper">
      <div class="dessert-slider" id="dessertSlider"></div>

      <button class="dessert-slide-btn left" onclick="prevDessertSlide()">
        &#10094;
      </button>
      <button class="dessert-slide-btn right" onclick="nextDessertSlide()">
        &#10095;
      </button>
    </div>

    <!-- ⭐ DESSERT ITEMS -->
    <div class="dessert-container">
      <h2 class="dessert-title">Our Desserts</h2>
      <div id="dessert-items" class="dessert-grid"></div>
    </div>

    <!-- SCRIPTS -->
    <script src="../header/header.js"></script>
    <script src="../cart/cart.js"></script>
    <script src="desserts.slider.js"></script>
    <script src="dessertsCard.js"></script>
    <script src="dessertsModal.js"></script>
    <script src="desserts.js"></script>

    <script>
      document.getElementById("header").innerHTML = new Header().render();
    </script>
  </body>
</html>
