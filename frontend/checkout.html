<!doctype html>
<html lang="en">
  <head>
    <meta http-equiv="Content-Language" content="en" />
    <meta charset="UTF-8" />
    <title>Checkout • BabasKitchen</title>

    <!-- GLOBAL STYLES -->
    <link rel="stylesheet" href="./styles/main.css" />

    <!-- HEADER STYLE -->
    <link rel="stylesheet" href="./header/header.css" />

    <!-- CHECKOUT STYLE -->
    <link rel="stylesheet" href="./cart/checkout.css" />
  </head>

  <body>
    <!-- HEADER -->
    <div id="header"></div>

    <!-- PAGE WRAPPER -->
    <div class="checkout-page-wrapper">
      <h1 class="checkout-title">Checkout</h1>

      <!-- CHECKOUT CONTENT -->
      <div id="checkout-container"></div>
    </div>

    <!-- ⭐ HIDDEN WEB3FORMS ORDER SUBMISSION FORM -->
    <form
      id="orderForm"
      action="https://api.web3forms.com/submit"
      method="POST"
      style="display: none"
    >
      <input
        type="hidden"
        name="access_key"
        value="a617f05a-44d7-4412-a3b4-27c0733773f9"
      />
      <input type="hidden" name="subject" value="New Order Received" />
      <input type="hidden" name="from_name" id="form_from_name" />

      <input type="hidden" name="name" id="form_name" />
      <input type="hidden" name="phone" id="form_phone" />
      <input type="hidden" name="address" id="form_address" />
      <input type="hidden" name="payment" id="form_payment" />
      <input type="hidden" name="items" id="form_items" />
      <input type="hidden" name="subtotal" id="form_subtotal" />
      <input type="hidden" name="total" id="form_total" />
    </form>

    <!-- HEADER -->
    <script src="./header/header.js"></script>

    <!-- CART -->
    <script src="./cart/cart.js"></script>
    <script src="./cart/cartDrawer.js"></script>

    <!-- CHECKOUT LOGIC -->
    <script src="./cart/checkout.js"></script>

    <script>
      // Render header
      initHeader();

      // Render checkout page
      const checkoutPage = new CheckoutPage();
      document.getElementById("checkout-container").innerHTML =
        checkoutPage.render();

      // Update cart count
      const cart = new Cart();
      cart.updateCartCount();
    </script>
  </body>
</html>
