<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Catering • BabasKitchen</title>

    <!-- GLOBAL STYLES -->
    <link rel="stylesheet" href="./styles/main.css" />
    <link rel="stylesheet" href="./desserts/desserts.modal.css" />

    <!-- HEADER STYLE -->
    <link rel="stylesheet" href="./header/header.css" />

    <!-- CATERING PAGE STYLE -->
    <link rel="stylesheet" href="./catering/catering.layout.css" />
    <link rel="stylesheet" href="./catering/catering.sidebar.css" />
    <link rel="stylesheet" href="./catering/catering.cards.css" />
    <link rel="stylesheet" href="./catering/catering.modals.css" />
    <link rel="stylesheet" href="./catering/catering.typography.css" />
  </head>

  <body>
    <!-- HEADER -->
    <div id="header"></div>

    <!-- ⭐ FIXED: REMOVED page-container wrapper -->
    <main class="catering-page">
      <div id="catering-sidebar"></div>
      <div id="catering-content"></div>
    </main>

    <!-- ⭐ CATERING TRAY POPUP -->
    <div class="catering-modal-overlay" id="cateringModal">
      <div class="catering-modal">
        <div class="catering-modal-content">
          <h2 id="cateringModalName"></h2>

          <!-- SMALL TRAY -->
          <div class="tray-row">
            <div class="tray-top">
              <span class="tray-title">Small Tray</span>
              <span class="tray-price" id="cateringSmallPriceUnit"></span>
              <span class="tray-total-inline">
                Total: <span id="cateringSmallTotal">$0</span>
              </span>
            </div>

            <div class="tray-controls">
              <button class="qty-btn" onclick="changeCateringQty('small', -1)">
                −
              </button>
              <span id="cateringSmallQty">0</span>
              <button class="qty-btn" onclick="changeCateringQty('small', 1)">
                +
              </button>
            </div>
          </div>

          <!-- LARGE TRAY -->
          <div class="tray-row">
            <div class="tray-top">
              <span class="tray-title">Large Tray</span>
              <span class="tray-price" id="cateringLargePriceUnit"></span>
              <span class="tray-total-inline">
                Total: <span id="cateringLargeTotal">$0</span>
              </span>
            </div>

            <div class="tray-controls">
              <button class="qty-btn" onclick="changeCateringQty('large', -1)">
                −
              </button>
              <span id="cateringLargeQty">0</span>
              <button class="qty-btn" onclick="changeCateringQty('large', 1)">
                +
              </button>
            </div>
          </div>

          <!-- SUBTOTAL -->
          <div class="dessert-subtotal">
            Subtotal: <span id="cateringSubtotal">$0</span>
          </div>

          <button class="add-btn" onclick="addCateringToCart()">
            Add to Cart
          </button>
          <button class="close-btn" onclick="closeCateringModal()">
            Close
          </button>
        </div>
      </div>
    </div>

    <!-- ⭐ SINGLE‑ITEM MODAL -->
    <div class="single-modal-overlay" style="display: none">
      <div class="single-modal">
        <h2 id="single-item-name"></h2>

        <div class="qty-controls">
          <button class="qty-btn" id="single-minus">−</button>
          <span id="single-qty">1</span>
          <button class="qty-btn" id="single-plus">+</button>
        </div>

        <div class="single-total">Total: $<span id="single-total">0</span></div>

        <div class="single-modal-footer">
          <button class="single-add-btn" id="single-add-btn">
            Add to Cart
          </button>
          <button class="single-close-btn" onclick="closeSingleModal()">
            Close
          </button>
        </div>
      </div>
    </div>

    <!-- SCRIPTS -->
    <script src="./header/header.js"></script>
    <script src="./cart/cart.js"></script>
    <script src="./catering/cateringSidebar.js"></script>
    <script src="./catering/cateringCard.js"></script>
    <script src="./catering/cateringModal.js"></script>
    <script src="./catering/catering.js"></script>

    <script>
      initHeader();
    </script>
  </body>
</html>
