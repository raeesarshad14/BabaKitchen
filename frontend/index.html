<!doctype html>
<html lang="en">
  <head>
    <meta http-equiv="Content-Language" content="en" />
    <meta charset="UTF-8" />
    <title>Restaurant App</title>

    <!-- GLOBAL STYLES -->
    <link rel="stylesheet" href="./styles/animations.css" />
    <link rel="stylesheet" href="./styles/layout.css" />
    <link rel="stylesheet" href="./styles/main.css" />

    <!-- HEADER + SLIDER STYLES -->
    <link rel="stylesheet" href="./header/header.css" />
    <link rel="stylesheet" href="./slider/slider.css" />
  </head>

  <body>
    <!-- HEADER -->
    <div id="header"></div>

    <!-- WELCOME TEXT -->
    <h1 class="typewriter">Welcome to BabasKitchen</h1>

    <!-- SLIDER -->
    <div id="sliderWrapper">
      <div id="slider"></div>
    </div>

    <!-- SCRIPTS -->
    <!-- Header -->
    <script src="./header/header.js"></script>

    <!-- Slider -->
    <script src="./slider/slider.js"></script>

    <!-- Cart (for cart count + drawer) -->
    <script src="./cart/cart.js"></script>
    <script src="./cart/cartDrawer.js"></script>

    <script>
      // HEADER
      initHeader();

      // SLIDER
      const slider = new Slider([
        "./assets/BabasKitchen Statement.png",
        "./assets/Biryani.png",
        "./assets/ChickenCurry.png",
        "./assets/HalwaPuri.png",
      ]);
      document.getElementById("slider").innerHTML = slider.render();
      slider.init();

      // GLOBAL CART INSTANCE
      const cart = new Cart();

      // UPDATE CART COUNT
      function updateCartCount() {
        const count = cart.getCount();
        const cartCountEl = document.getElementById("cart-count");
        cartCountEl.textContent = count === 0 ? "" : count;
      }

      updateCartCount();
    </script>
  </body>
</html>
